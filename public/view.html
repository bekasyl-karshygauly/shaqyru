  const s={...guestLanguageState(normalizeState(j.data),q.get("lang")||j.data.lang,EV),paid:j.preview?0:1};
  const languageResume=mountGuestLanguage(vg,s,j);
  document.documentElement.lang=s.lang==="kz"?"kk":"ru";
  document.title=(s.names||"Шақыру")+" — "+(s.lang==="kz"?"Шақыру":"Приглашение");
  document.body.classList.toggle("owner-preview",!!j.preview);
  const t=T[s.lang]||T.ru;
  const d=DG[s.dsg]||DG[0];
  const ac=s.c.ac||d[5]||"#a78bfa";
  const R=document.documentElement.style;
  document.title=s.names||"Шақыру";
  R.setProperty("--ac",ac);
  R.setProperty("--al",`color-mix(in srgb,${ac} 60%,#fff)`);
  const ambientScene=mountScene(document.body,s,{scrollDriven:!!(window.gsap&&window.ScrollTrigger)});
  window.addEventListener('pagehide',event=>{if(!event.persisted)ambientScene.destroy()});
  if(j.preview){const pb=E("div","preview-banner");pb.innerHTML=`<span>👁️</span><span>${s.lang==="kz"?"Алдын ала қарау: қонақтар шақыруды ұйымдастырушы жариялағаннан кейін көреді":"Предпросмотр: гости увидят страницу после публикации организатором"}</span>`;vg.appendChild(pb)}
  if(j.guest){
    const gh=E("div","guest-hero");
    const evEmoji=["💍","🌸","👶","🎉","✨","🏆","🤝","🏠","👣","💬","🎂"][s.ev]||"✨";
    gh.innerHTML=`<div class="guest-avatar">${evEmoji}</div><div class="guest-welcome">${esc(guestGreeting(s,j.guest.name))}</div><div class="guest-sub">${t.gSub}</div>`;
    vg.appendChild(gh);
  }
  const cw=E("div","cw pop pr");cw.innerHTML=card(s,{free:!j.preview});vg.appendChild(cw);
  const shortcuts=E("nav","guest-shortcuts");shortcuts.setAttribute("aria-label",s.lang==="kz"?"Жылдам өту":"Быстрые действия");
  for(const [target,title] of [["guest-rsvp",s.lang==="kz"?"Жауап беру":"Ответить"],...(s.place||s.addr?[["guest-place",s.lang==="kz"?"Мекенжай":"Как добраться"]]:[]),...(s.date&&calendar(s,id)?[["guest-actions",s.lang==="kz"?"Күнтізбе":"Календарь"]]:[])]){const a=E("a","",title);a.href="#"+target;a.onclick=e=>{e.preventDefault();const block=document.getElementById(target);block?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});block?.focus({preventScroll:true})};shortcuts.append(a)}vg.append(shortcuts);
  mountStory(vg,s);
  const dt=s.date?eventInstant(s.date,s.time||"00:00",s.zone):null;
  if(dt&&!isNaN(dt)){
    const gl=E("div","gl");gl.innerHTML=`<h3>${s.lang==="kz"?"⏳ Дейін":"⏳ До события"}</h3>`;
    if(dt-Date.now()<0){gl.appendChild(E("div","cd-done",t.cdDone))}
    else{
      const cd=E("div","cd");
      const nums=[0,1,2,3].map(i=>{const cell=E("div","cd-cell");const b=E("b","","0");const sp=E("span","",t.cd[i]);cell.append(b,sp);cd.appendChild(cell);return b});
      gl.appendChild(cd);
      const tick=()=>{let ms=Math.max(0,dt-Date.now())/1000;[86400,3600,60,1].forEach((u,i)=>{nums[i].textContent=Math.floor(ms/u);ms%=u})};
      tick();setInterval(tick,1000);
    }
    vg.appendChild(gl);
  }
  const rows=(s.sch||"").split("\n").map(x=>x.trim()).filter(Boolean);
  if(rows.length){
    const gl=E("div","gl");gl.innerHTML=`<h3>📋 ${t.sch}</h3>`;
    const tl=E("div","tl");
    rows.forEach(r=>{
      const item=E("div","tl-item");
      const m=/^(\d{1,2}[:.]?\d{2})\s+(.*)$/.exec(r);
      const tc=E("div","tl-time-col");
      const dc=E("div","tl-dot-col");
      dc.append(E("div","tl-dot"),E("div","tl-line"));
      const ct=E("div","tl-content");
      if(m){tc.innerHTML=`<span class="tl-time">${m[1].replace(".",":")}</span>`;ct.innerHTML=`<div class="tl-event">${esc(m[2])}</div>`}
      else ct.innerHTML=`<div class="tl-plain">${esc(r)}</div>`;
      item.append(tc,dc,ct);tl.appendChild(item);
    });
    gl.appendChild(tl);vg.appendChild(gl);
  }
  if(s.place||s.addr){
    const gl=E("div","gl");gl.id="guest-place";gl.tabIndex=-1;gl.innerHTML=`<h3>📍 ${t.pl}</h3>`;
    const pb=E("div","place-block");
    if(s.place)pb.appendChild(E("div","place-name",s.place));
    if(s.addr)pb.appendChild(E("div","place-addr",s.addr));
    const ma=E("a","map-btn");
    const routes=maps(s);ma.href=routes.dgis;
    ma.target="_blank";ma.rel="noopener";
    ma.innerHTML=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> ${t.map}`;
    const google=E("a","map-btn","Google Maps");google.href=routes.google;google.target="_blank";google.rel="noopener";
    ma.appendChild(document.createTextNode(" · 2ГИС"));pb.append(ma,google);gl.appendChild(pb);vg.appendChild(gl);
  }
  mountGuestDetails(vg,s);
  const musSrc=s.mus,hasMus=typeof musSrc==="string"&&musSrc.trim()!==""&&musSrc!=="none";
  let audioEl=null,musOn=0,fmb=null;
  if(hasMus){fmb=E("button","floating-music-btn");fmb.type="button";fmb.setAttribute("aria-label",t.mu);fmb.setAttribute("aria-pressed","false");fmb.innerHTML=`<span class="eq-bars" aria-hidden="true"><span></span><span></span><span></span><span></span></span><span class="mus-lbl">${esc(s.musTitle||t.mu)}</span>`;document.body.appendChild(fmb)}
  const toggleMus=()=>{
    if(!hasMus)return;
    if(musOn){if(audioEl)audioEl.pause();musOn=0;fmb&&fmb.classList.remove("playing");fmb?.setAttribute("aria-pressed","false");return}
    if(!audioEl){audioEl=new Audio(musSrc);audioEl.loop=true;audioEl.volume=.82}
    audioEl.play().then(()=>{musOn=1;fmb&&fmb.classList.add("playing");fmb?.setAttribute("aria-pressed","true")}).catch(()=>{});
  };
  if(fmb)fmb.onclick=toggleMus;
  const actgl=E("div","gl");actgl.id="guest-actions";actgl.tabIndex=-1;actgl.innerHTML=`<h3>⚡ ${s.lang==="kz"?"Әрекеттер":"Действия"}</h3>`;
  const ar=E("div","actions-row");
  if(s.date&&calendar(s,id)){const cb=E("button","act-btn",s.lang==="kz"?"📅 Күнтізбеге қосу":"📅 Добавить в календарь");cb.onclick=()=>download(calendar(s,id),"text/calendar;charset=utf-8","invitation.ics");ar.appendChild(cb)}
  if(hasMus){const mb=E("button","act-btn");mb.innerHTML=`♪ ${esc(s.musTitle||t.mu)}`;mb.onclick=toggleMus;ar.appendChild(mb)}
  if(s.vc)mountInvitationSpeech(ar,{lang:s.lang,label:t.vc,text:[j.guest?guestGreeting(s,j.guest.name):"",EV[s.ev][s.lang==="kz"?0:1]+". "+s.names+". "+s.text,[s.date?s.date.split("-").reverse().join("."):"",(s.time||"")].filter(Boolean).join(" ")+" "+s.place+" "+s.addr].filter(Boolean).join(" ")});
  if(!j.preview){const pb2=E("button","act-btn","🖨 "+t.pr);pb2.onclick=()=>print();ar.appendChild(pb2)}
  if(!j.preview){const qr=E("button","act-btn",s.lang==="kz"?"QR / Басып шығару":"QR / Печать");qr.onclick=()=>openPrintQr(location.href,s.names,s.lang);ar.append(qr)}
  actgl.appendChild(ar);vg.appendChild(actgl);
  const rsgl=E("div","gl");rsgl.id="guest-rsvp";rsgl.tabIndex=-1;rsgl.innerHTML=`<h3>✍️ ${t.rs}</h3>`;
  const form=E("div","rsvp-form");
  let guestCnt=Math.max(1,Math.min(10,languageResume?.count||j.guest?.cnt||1));
  const nameInp=E("input","rsvp-input");
  nameInp.type="text";nameInp.id="guest-name";nameInp.maxLength=60;nameInp.placeholder=t.nm;nameInp.autocomplete="name";
  if(j.guest){nameInp.value=j.guest.name;nameInp.disabled=true}
  const nameLabel=E("label","rsvp-label",t.nm);nameLabel.htmlFor=nameInp.id;form.append(nameLabel,nameInp);
  const cntRow=E("div","cnt-row");
  cntRow.innerHTML=`<span class="cnt-label">${t.cnt}</span>`;
  const cntCtrl=E("div","cnt-ctrl");
  const cntMinus=E("button","cnt-btn","−");
  const cntVal=E("div","cnt-val",String(guestCnt));
  const cntPlus=E("button","cnt-btn","+");
  cntMinus.setAttribute("aria-label",s.lang==="kz"?"Қонақ санын азайту":"Уменьшить количество гостей");cntPlus.setAttribute("aria-label",s.lang==="kz"?"Қонақ санын көбейту":"Увеличить количество гостей");cntVal.setAttribute("aria-live","polite");
  const syncCount=()=>{cntVal.textContent=guestCnt;cntMinus.disabled=guestCnt<=1;cntPlus.disabled=guestCnt>=10};syncCount();
  cntMinus.onclick=()=>{guestCnt=Math.max(1,guestCnt-1);syncCount()};
  cntPlus.onclick=()=>{guestCnt=Math.min(10,guestCnt+1);syncCount()};
  cntCtrl.append(cntMinus,cntVal,cntPlus);cntRow.appendChild(cntCtrl);form.appendChild(cntRow);
  const extraQuestions=j.rsvpDetailsReady||j.preview?mountRsvpQuestions(form,s,j.guest?.details,()=>guestCnt):null;
  const noteArea=E("textarea","note-area");noteArea.id="guest-note";noteArea.maxLength=300;noteArea.placeholder=t.nt;noteArea.rows=2;const noteLabel=E("label","rsvp-label",t.nt);noteLabel.htmlFor=noteArea.id;form.append(noteLabel,noteArea);
  const btnRow=E("div","rsvp-btns");
  const yesBtn=E("button","rsvp-yes",t.yes);
  const noBtn=E("button","rsvp-no",t.no);
  if(j.preview){yesBtn.disabled=noBtn.disabled=true}
  const rsvpError=E("p","rsvp-error");rsvpError.setAttribute("role","alert");form.append(rsvpError);
  if(j.preview)form.append(E("p","rsvp-preview-note",s.lang==="kz"?"Алдын ала қарау: жауап жіберілмейді.":"Это предпросмотр. Отправка ответов доступна гостям опубликованного приглашения."));
  const sendRsvp=async(status)=>{
    rsvpError.textContent="";
    if(!j.guest&&!nameInp.value.trim()){nameInp.focus();nameInp.setCustomValidity(t.nm);nameInp.reportValidity();nameInp.oninput=()=>nameInp.setCustomValidity("");return}
    const details=status==='yes'?extraQuestions?.read():{};if(details===null)return;
    yesBtn.disabled=noBtn.disabled=true;
    const lbl=status==="yes"?yesBtn:noBtn;
    const orig=lbl.textContent;
    lbl.innerHTML=`<span style="display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite"></span>`;
    try{
      const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(nameInp.value.normalize("NFKC").trim().toLocaleLowerCase()));
      const requestKey="shq-rsvp:"+id+":"+Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,"0")).join("");
      let requestId=responses.get(requestKey);try{requestId=localStorage.getItem(requestKey)||requestId}catch{}
      if(!requestId){requestId=createRequestId();responses.set(requestKey,requestId);try{localStorage.setItem(requestKey,requestId)}catch{}}
      const r=await fetch("/api/rsvp/"+id,{method:"POST",headers:{"Content-Type":"application/json",...(visitorToken?{"x-guest-token":visitorToken}:{})},body:JSON.stringify({code:q.get("g")||undefined,requestId,name:nameInp.value,status,cnt:guestCnt,note:noteArea.value,...(extraQuestions?{details}:{})}),signal:AbortSignal.timeout(15000)});
      if(!r.ok){const failure=await r.json();throw new Error(failure.error||t.err)}
      rsgl.innerHTML=`<div class="rsvp-success" role="status"><div class="rsvp-success-ring">${status==="yes"?"🎉":"👋"}</div><h3>${t.th}</h3><p>${status==="yes"?t.thSub:s.lang==="kz"?"Хабарлағаныңызға рақмет!":"Спасибо, что сообщили!"}</p></div>`;
      rsgl.focus({preventScroll:true});
    }catch(e){
      yesBtn.disabled=noBtn.disabled=j.preview;lbl.textContent=orig;
      rsvpError.textContent=e.message||t.err;
    }
  };
  yesBtn.onclick=()=>sendRsvp("yes");noBtn.onclick=()=>sendRsvp("no");
  btnRow.append(yesBtn,noBtn);form.appendChild(btnRow);rsgl.appendChild(form);vg.appendChild(rsgl);
  if(languageResume){
    for(const field of languageResume.fields||[]){const input=document.getElementById(field.id);if(input&&!input.disabled&&input.closest('.rsvp-form')){input.value=field.value;input.checked=field.checked}}
    if(languageResume.sent){rsgl.replaceChildren(E('p','rsvp-success',t.th));rsgl.setAttribute('role','status')}
  }
  const motion=mountInvitationScroll({host:vg,card:cw,state:s,opening:!j.preview&&!languageResume&&!q.get('print'),onProgress:({ambientTime})=>ambientScene.seek(ambientTime),onActivate:()=>{if(hasMus&&!musOn)toggleMus()}});
  if(q.get('embedded')==='1'){let savedScroll=0;try{savedScroll=Number(sessionStorage.getItem('shq-preview-scroll:'+location.hash.slice(1)))||0}catch{}requestAnimationFrame(()=>scrollTo(0,savedScroll))}
  if(q.get("print")&&!j.preview){setTimeout(()=>window.print(),600)}
  else if(j.preview){
    const testIntro=E("button","act-btn",s.lang==="kz"?"▶ Ашу анимациясын көру":"▶ Проверить анимацию открытия");
    testIntro.dataset.testIntro='true';testIntro.onclick=()=>motion.replay();ar.prepend(testIntro);
  }
})().catch(e=>{document.querySelectorAll(".intro").forEach(el=>el.remove());document.getElementById("vg").innerHTML='<div class="gl"><p>Не удалось показать приглашение. Вернитесь в редактор и откройте предпросмотр ещё раз.</p><a href="/" class="map-btn">Вернуться в редактор</a></div>';console.error("Invitation rendering failed",e)});
</script>
</body></html>
